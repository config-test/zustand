version: 2.1

jobs:
  test:
    docker:
      - image: cimg/node:22.11
    working_directory: ~/zustand
    environment:
      # Let corepack download the pinned pnpm without an interactive prompt.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - checkout
      - run:
          name: Enable pnpm
          command: |
            sudo corepack enable
            pnpm config set store-dir ~/.pnpm-store
            pnpm --version
      - restore_cache:
          keys:
            - pnpm-store-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-store-v1-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Run tests
          command: pnpm run test:spec
      - save_cache:
          key: pnpm-store-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store

workflows:
  ci:
    jobs:
      - test
