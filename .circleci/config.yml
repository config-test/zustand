version: 2.1

jobs:
  zustand:
    docker:
      - image: cimg/node:26.11
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-pnpm-11-node-26.11-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install dependencies
          command: |
            npm install --prefix "$HOME/.local" --no-save pnpm@11.3.0
            export PATH="$HOME/.local/node_modules/.bin:$PATH"
            echo 'export PATH="$HOME/.local/node_modules/.bin:$PATH"' >> "$BASH_ENV"
            pnpm install --frozen-lockfile --store-dir "$HOME/.pnpm-store"
      - save_cache:
          key: v1-pnpm-11-node-26.11-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store
      - run:
          name: Build
          command: pnpm run build
      # The root test script includes formatting, types, lint and Vitest.
      - run:
          name: Test and lint
          command: pnpm run test

workflows:
  checks:
    jobs:
      - zustand
